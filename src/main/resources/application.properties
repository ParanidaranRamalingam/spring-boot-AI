# Local secrets live in ./local.properties (gitignored); env var works as fallback
spring.config.import=optional:file:./local.properties

# LLM gateway configuration
spring.ai.anthropic.base-url=https://llmgw-wp.tekstac.com
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

# Model details
spring.ai.anthropic.chat.options.model=global.anthropic.claude-haiku-4-5-20251001-v1:0
spring.ai.anthropic.chat.options.max-tokens=1024
spring.ai.anthropic.chat.options.temperature=0.7

# Server (8080 is used by the system Tomcat)
server.port=8081
