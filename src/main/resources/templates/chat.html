<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--chat">
    <header class="topbar">
        <div class="brand">Claude Chat<small>global.anthropic.claude-haiku-4-5 · llmgw-wp.tekstac.com</small></div>
        <nav class="nav">
            <a href="/demo">Demos</a>
            <a href="/rag">RAG</a>
            <a href="/memory">Memory</a>
        </nav>
    </header>
    <div class="chips">
        <span class="chips-label">Try:</span>
        <button class="chip" onclick="useExample(this)">Tell me a fun fact about Spring Boot</button>
        <button class="chip" onclick="useExample(this)">Explain microservices in one sentence</button>
        <button class="chip" onclick="useExample(this)">Write a haiku about Java</button>
    </div>
    <div class="card chat-shell">
        <div id="messages">
            <div class="hint" th:if="${userMessage == null}">Send a message or tap an example above to start chatting.</div>
            <div class="msg user" th:if="${userMessage != null}" th:text="${userMessage}"></div>
            <div class="msg assistant" th:if="${response != null}" th:text="${response}"></div>
            <div class="msg error" th:if="${error != null}" th:text="'Error: ' + ${error}"></div>
        </div>
        <form class="composer" method="post" action="/">
            <input name="message" type="text" placeholder="Type a message..." autocomplete="off" autofocus required>
            <button class="btn" type="submit">Send</button>
        </form>
    </div>
</div>
<script>
    function useExample(el) {
        const input = document.querySelector('input[name="message"]');
        input.value = el.textContent;
        input.closest('form').requestSubmit();
    }
</script>
</body>
</html>
