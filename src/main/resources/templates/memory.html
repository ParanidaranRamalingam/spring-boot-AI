<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Memory</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container container--chat">
    <header class="topbar">
        <div class="brand">Chat Memory<small>MessageChatMemoryAdvisor · MessageWindowChatMemory (last 20 msgs)</small></div>
        <nav class="nav">
            <a href="/">Chat</a>
            <a href="/rag">RAG</a>
            <a href="/demo">Demos</a>
        </nav>
    </header>
    <div class="chips">
        <span class="chips-label">Try:</span>
        <button class="chip" onclick="useExample(this)">My name is Ada and I like hiking</button>
        <button class="chip" onclick="useExample(this)">What's my name?</button>
        <button class="chip" onclick="useExample(this)">What hobby did I mention?</button>
    </div>
    <div class="card chat-shell">
        <div class="conv-bar">
            <label for="conv-id">conversationId:</label>
            <input id="conv-id" type="text" value="demo" onchange="loadHistory()">
            <button type="button" class="ghost" id="hist-btn" onclick="toggleHistory()">Show history</button>
            <span class="tip">Same id remembers — a different id starts fresh.</span>
        </div>
        <div id="history-panel"></div>
        <div id="messages">
            <div class="hint">Try "My name is Ada and I like hiking", then "What's my name?"</div>
        </div>
        <form class="composer" onsubmit="send(event)">
            <input name="message" type="text" placeholder="Type a message..." autocomplete="off" autofocus required>
            <button class="btn" id="send-btn" type="submit">Send</button>
        </form>
    </div>
</div>

<script>
    const messagesEl = document.getElementById('messages');
    const convInput = document.getElementById('conv-id');
    const sendBtn = document.getElementById('send-btn');
    const histBtn = document.getElementById('hist-btn');
    const histPanel = document.getElementById('history-panel');

    function useExample(el) {
        const input = document.querySelector('input[name="message"]');
        input.value = el.textContent;
        input.closest('form').requestSubmit();
    }

    function renderHistory(items) {
        messagesEl.innerHTML = '';
        if (!items.length) {
            messagesEl.innerHTML = '<div class="hint">No messages yet in this conversation.</div>';
            return;
        }
        for (const item of items) {
            const div = document.createElement('div');
            div.className = 'msg ' + (item.role === 'user' ? 'user' : 'assistant');
            div.textContent = item.text;
            messagesEl.appendChild(div);
        }
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderHistoryPanel(items) {
        if (!items.length) {
            histPanel.innerHTML = '<div class="hist-empty">No stored messages for this conversationId.</div>';
            return;
        }
        histPanel.innerHTML = '';
        for (const item of items) {
            const row = document.createElement('div');
            row.className = 'hist-row';
            const role = document.createElement('span');
            role.className = 'hist-role';
            role.textContent = item.role;
            const text = document.createElement('span');
            text.className = 'hist-text';
            text.textContent = item.text;
            row.append(role, text);
            histPanel.appendChild(row);
        }
    }

    async function fetchHistory() {
        const res = await fetch('/memory/history?conversationId=' +
            encodeURIComponent(convInput.value.trim() || 'demo'));
        return res.ok ? await res.json() : [];
    }

    async function loadHistory() {
        try {
            const items = await fetchHistory();
            renderHistory(items);
            if (histPanel.classList.contains('show')) renderHistoryPanel(items);
        } catch (err) { /* history is best-effort */ }
    }

    async function toggleHistory() {
        const showing = histPanel.classList.toggle('show');
        histBtn.textContent = showing ? 'Hide history' : 'Show history';
        if (showing) {
            histPanel.innerHTML = '<div class="hist-empty">Loading…</div>';
            renderHistoryPanel(await fetchHistory());
        }
    }

    async function send(event) {
        event.preventDefault();
        const input = event.target.message;
        const text = input.value.trim();
        if (!text) return;
        sendBtn.disabled = true;
        // Optimistically show the user message + a thinking bubble.
        const userDiv = document.createElement('div');
        userDiv.className = 'msg user';
        userDiv.textContent = text;
        const thinking = document.createElement('div');
        thinking.className = 'msg assistant thinking';
        thinking.textContent = 'Thinking…';
        messagesEl.querySelector('.hint')?.remove();
        messagesEl.append(userDiv, thinking);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        input.value = '';
        try {
            const params = new URLSearchParams({
                message: text,
                conversationId: convInput.value.trim() || 'demo'
            });
            const res = await fetch('/memory/ask?' + params.toString());
            const body = await res.text();
            thinking.className = 'msg assistant' + (res.ok ? '' : ' error');
            thinking.textContent = res.ok ? body : 'Error ' + res.status + ': ' + body;
        } catch (err) {
            thinking.className = 'msg error';
            thinking.textContent = 'Request failed: ' + err.message;
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
        // Re-render from stored history so the view always matches memory.
        loadHistory();
    }

    loadHistory();
</script>
</body>
</html>
